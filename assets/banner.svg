<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Zoran D. Miller — AI Automation Architect, Full-Stack Engineer, Micro-SaaS Builder">
  <defs>
    <!-- studio product-viz backdrop -->
    <radialGradient id="studio" cx="34%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1c1d22"/>
      <stop offset="45%" stop-color="#101116"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>
    <!-- chrome / luxury metallic wordmark -->
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="42%" stop-color="#c9ccd2"/>
      <stop offset="52%" stop-color="#7f838c"/>
      <stop offset="53%" stop-color="#eef1f5"/>
      <stop offset="100%" stop-color="#9a9ea6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4324"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#37e6ff"/>
      <stop offset="100%" stop-color="#2b6bff"/>
    </linearGradient>
    <!-- moving shimmer sweep -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <mask id="wordmask">
      <rect width="1200" height="340" fill="black"/>
      <text x="64" y="176" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="86" letter-spacing="-2" fill="white">ZORAN D. MILLER</text>
    </mask>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <style>
      @keyframes sweepmove { 0%{transform:translateX(-380px)} 100%{transform:translateX(1240px)} }
      @keyframes spin { 100%{transform:rotate(360deg)} }
      @keyframes twinkle { 0%,100%{opacity:.25} 50%{opacity:.9} }
      @keyframes scan { 0%{transform:translateY(0)} 100%{transform:translateY(340px)} }
      @keyframes tick { 0%,100%{opacity:.35} 50%{opacity:1} }
      .sweep { animation: sweepmove 4.6s linear infinite; }
      .obj   { transform-origin:1040px 150px; animation: spin 22s linear infinite; }
      .tw    { animation: twinkle 3.2s ease-in-out infinite; }
      .tw2   { animation: twinkle 3.2s ease-in-out infinite; animation-delay:1.1s; }
      .scan  { animation: scan 5.5s linear infinite; }
      .tick  { animation: tick 2.4s steps(1) infinite; }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="340" fill="url(#studio)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>

  <!-- Swiss grid rules -->
  <g stroke="#ffffff" stroke-opacity="0.09">
    <line x1="64" y1="44" x2="1136" y2="44"/>
    <line x1="64" y1="296" x2="1136" y2="296"/>
    <line x1="880" y1="44" x2="880" y2="296"/>
  </g>

  <!-- drifting scanline (Y2K) -->
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#37e6ff" fill-opacity="0.06"/>

  <!-- top editorial labels -->
  <text x="64" y="34" font-family="'SF Mono',Consolas,monospace" font-size="12" letter-spacing="6" fill="#8a8f98">PORTFOLIO / 2026</text>
  <text x="820" y="34" text-anchor="end" font-family="'SF Mono',Consolas,monospace" font-size="12" letter-spacing="6" fill="#8a8f98">SYS.STATUS&#160;&#160;<tspan class="tick" fill="#4ade80">●</tspan>&#160;LIVE</text>

  <!-- index number, luxury oversize -->
  <text x="60" y="300" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="26" fill="#ffffff" fill-opacity="0.05">01</text>

  <!-- chrome wordmark -->
  <text x="64" y="176" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="86" letter-spacing="-2" fill="url(#chrome)">ZORAN D. MILLER</text>
  <!-- shimmer sweep clipped to wordmark -->
  <g mask="url(#wordmask)">
    <rect class="sweep" x="0" y="80" width="300" height="120" fill="url(#sweep)"/>
  </g>

  <!-- accent rule under name -->
  <rect x="66" y="196" width="150" height="4" fill="url(#accent)"/>
  <rect x="222" y="197" width="60" height="2" fill="url(#cyan)"/>

  <!-- role line, monospace computational -->
  <text x="66" y="236" font-family="'SF Mono',Consolas,monospace" font-size="17" letter-spacing="2" fill="#e7e8ea">AI&#160;AUTOMATION&#160;ARCHITECT<tspan fill="#5b606a">&#160;&#160;/&#160;&#160;</tspan>FULL-STACK&#160;ENGINEER<tspan fill="#5b606a">&#160;&#160;/&#160;&#160;</tspan>MICRO-SAAS</text>

  <!-- data readout -->
  <text x="66" y="272" font-family="'SF Mono',Consolas,monospace" font-size="12" letter-spacing="3" fill="#7c818b">STACK&#160;<tspan fill="#37e6ff">NEXT.JS</tspan>&#160;·&#160;<tspan fill="#37e6ff">CONVEX</tspan>&#160;·&#160;<tspan fill="#37e6ff">VERCEL</tspan>&#160;·&#160;<tspan fill="#ff6a3d">CLAUDE</tspan>&#160;·&#160;<tspan fill="#ff6a3d">OPENAI</tspan></text>

  <!-- right column: computational product-viz object -->
  <g class="obj" fill="none" stroke-width="1.5">
    <!-- rotating wire icosa-ish gem (premium product) -->
    <g stroke="url(#cyan)" stroke-opacity="0.85">
      <polygon points="1040,90 1100,140 1078,210 1002,210 980,140"/>
      <polygon points="1040,90 1078,210 1040,150" stroke-opacity="0.45"/>
      <polygon points="1040,90 1002,210 1040,150" stroke-opacity="0.45"/>
      <line x1="980" y1="140" x2="1040" y2="150"/>
      <line x1="1100" y1="140" x2="1040" y2="150"/>
      <line x1="1002" y1="210" x2="1040" y2="150"/>
      <line x1="1078" y1="210" x2="1040" y2="150"/>
    </g>
  </g>
  <!-- static crosshair frame around object (Swiss registration marks) -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="1">
    <path d="M950 78 h14 M950 78 v14"/>
    <path d="M1130 78 h-14 M1130 78 v14"/>
    <path d="M950 222 h14 M950 222 v-14"/>
    <path d="M1130 222 h-14 M1130 222 v-14"/>
  </g>
  <circle class="tw" cx="928" cy="150" r="2" fill="#37e6ff"/>
  <circle class="tw2" cx="1152" cy="150" r="2" fill="#ff6a3d"/>

  <!-- object caption -->
  <text x="1040" y="252" text-anchor="middle" font-family="'SF Mono',Consolas,monospace" font-size="10" letter-spacing="4" fill="#5b606a">OPEN&#160;TO&#160;WORK</text>
</svg>
